<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo編集</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <header class="page-header">
      <h1>Todo編集</h1>
      <p class="subtitle">内容を変更して更新できます</p>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for category, message in messages %}
            <p class="message message-{{ category }}">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <section class="card form-card">
      <form method="post" action="{{ url_for('edit', todo_id=todo.id) }}" class="todo-form">
        <div class="form-group">
          <label for="title">タイトル <span class="required">必須</span></label>
          <input
            type="text"
            id="title"
            name="title"
            value="{{ todo.title }}"
            placeholder="例：買い物に行く"
            maxlength="200"
            required
          >
        </div>

        <div class="form-group">
          <label for="content">内容</label>
          <textarea
            id="content"
            name="content"
            rows="4"
            placeholder="詳しい内容を入力（任意）"
          >{{ todo.content }}</textarea>
        </div>

        <div class="form-group">
          <label for="due_date">期日</label>
          <input
            type="date"
            id="due_date"
            name="due_date"
            value="{{ todo.due_date }}"
          >
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">更新する</button>
          <a href="{{ url_for('index') }}" class="btn btn-link">一覧へ戻る</a>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
